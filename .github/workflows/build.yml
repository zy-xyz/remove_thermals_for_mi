name: build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  # 发 Release 才需要 write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add musl target
        run: rustup target add aarch64-unknown-linux-musl

      - name: Sanity checks
        run: |
          rustc --version
          cargo --version
          rustup target list --installed | grep aarch64-unknown-linux-musl

      - name: cargo check + unit tests (host)
        run: |
          cargo check --offline
          cargo test --offline --lib

      - name: Cross-compile (build.sh)
        run: bash scripts/build.sh

      - name: Verify static ELF
        run: |
          file build/thermald
          file build/thermald | grep -q 'statically linked'
          ! readelf -l build/thermald | grep -qE 'PT_INTERP|PT_DYNAMIC'
          sha256sum -c build/thermald.sha256

      - name: Package module zip
        run: bash scripts/package.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: thermald-${{ github.run_id }}
          path: |
            build/thermald
            build/thermald.sha256
            build/thermald-v*.zip
          if-no-files-found: error

      - name: GitHub Release on tag v*
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/thermald-v*.zip
          generate_release_notes: true
          fail_on_unmatched_files: false
